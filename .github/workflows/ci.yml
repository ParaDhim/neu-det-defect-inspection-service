name: Defect Inspection CI/CD Pipeline (uv)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Test & Validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install System Dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Dependencies via uv sync
        run: uv sync --all-groups

      - name: Run Pytest Test Suite via uv run
        env:
          MODEL_PATH: "models/onnx/model_int8.onnx"
          CONF_THRESHOLD: "0.28"
          BASELINE_PATH: "src/monitor/baseline_stats.json"
        run: |
          uv run pytest -v tests/ --durations=10

      - name: Docker Build Smoke Test
        run: |
          docker build -t neu-det-inspection:test .
