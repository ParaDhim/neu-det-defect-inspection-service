[project]
name = "neu-det-defect-inspection-service"
version = "1.0.0"
description = "Industrial Steel Surface Defect Inspection Service using YOLOv8, ONNX INT8, and MLflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Paras Dhiman" }
]
keywords = [
    "defect-detection",
    "yolov8",
    "onnx-runtime",
    "mlflow",
    "drift-monitoring",
    "fastapi",
    "kubernetes",
    "computer-vision",
]

dependencies = [
    # Deep Learning & Computer Vision
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.1.0",
    "opencv-python-headless>=4.8.0",
    "albumentations>=1.3.1",
    # Edge Inference & ONNX
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    # Serving & API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    # Statistical Drift Monitoring & Analytics
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    # Experiment Tracking & Utilities
    "mlflow>=2.10.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "certifi>=2023.7.22",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
