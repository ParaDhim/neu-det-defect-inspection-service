apiVersion: v1
kind: ConfigMap
metadata:
  name: defect-inspection-config
  namespace: default
  labels:
    app: defect-inspection
data:
  MODEL_PATH: "models/onnx/model_edge_fp32.onnx"
  CONF_THRESHOLD: "0.22"
  CLASS_CONF_THRESHOLDS: '{"crazing": 0.112}'
  IOU_THRESHOLD: "0.45"
  BASELINE_PATH: "src/monitor/baseline_stats.json"
  LOG_LEVEL: "INFO"
