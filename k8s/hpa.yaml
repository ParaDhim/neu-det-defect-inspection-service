apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: defect-inspection-hpa
  namespace: default
  labels:
    app: defect-inspection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: defect-inspection-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
